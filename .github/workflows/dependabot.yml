# Originally autogenerated by https://github.com/appkins/ecu/github.
# Hand-edited 2026-09-21 to close the auto-merge hole described below.
#
# WHAT WENT WRONG
# ---------------
# The previous version of this file approved every non-major bot PR and then
# ran `gh pr merge --auto` with no `if:` at all -- major bumps included. Two
# things made that unsafe:
#
#   1. `--auto` only waits for checks that branch protection marks *required*.
#      With no protection rule on `main` there is nothing to wait for, so the
#      PR merges as soon as GitHub will take it -- built or not.
#   2. The CI/CD workflow was path-filtered, so it did not even produce a
#      check run on every PR.
#
# Net effect: Dependabot moved go-unifi onto the v1.34.x tags, which are
# semver-higher but content-older, and main stopped compiling for 3.5 weeks.
#
# THE POLICY NOW
# --------------
#   * Auto-merge is limited to PATCH-level Dependabot bumps. Minor and major
#     bumps are left for a human -- the go-unifi break was a MINOR bump
#     (v1.33.x -> v1.34.x), and a "semver-major only" gate would have sailed
#     straight past it. Patch is the only level where "the version number says
#     it is safe" is a claim worth acting on unattended.
#   * Nothing is approved or merged until the CI/CD run for that exact commit
#     has finished and succeeded. This is enforced here, in the job, rather
#     than delegated to `--auto`, so the gate holds even though `main` has no
#     branch protection rule today. Turning on branch protection with CI/CD as
#     a required check is still worth doing -- it would make this belt and
#     braces -- but the gate no longer depends on it.
#   * Copilot PRs are no longer auto-approved or auto-merged. They are code
#     changes, not dependency bumps, and unattended merge of generated code is
#     the same hole in a different coat.
name: Bot PR Auto-Approve

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Dependabot-triggered runs get a read-only GITHUB_TOKEN by default; the
# `permissions` block is what raises it back to writable for this workflow.
permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot:
    name: Gate Dependabot auto-merge on CI
    runs-on: ubuntu-latest
    # Long enough to sit through a full CI/CD run, short enough that a hung
    # run does not pin a runner all day.
    timeout-minutes: 45
    # Gate on the PR *author*, not `github.actor`. On a `synchronize` event
    # `github.actor` is whoever pushed the commit, which is not necessarily
    # the bot that opened the PR.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Explain why this PR is not eligible for auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-patch'
        run: |
          echo "::notice::Update type is '${{ steps.metadata.outputs.update-type }}'. Auto-merge is limited to version-update:semver-patch; this PR needs a human review and merge."

      # Blocks until the CI/CD run for this exact head SHA has concluded, and
      # fails the job if it did not succeed. `gh run watch --exit-status`
      # returns non-zero on a failed run, so a broken bump stops right here
      # and is never approved.
      - name: Require a green CI/CD run for this commit
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # pull_request_target fires the moment the PR opens, so the CI/CD run
          # for this SHA may not have been created yet. Poll for it first.
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list \
              --repo "$GH_REPO" \
              --workflow ci.yaml \
              --branch "$HEAD_REF" \
              --limit 30 \
              --json databaseId,headSha \
              --jq "[.[] | select(.headSha == \"${HEAD_SHA}\")] | first | .databaseId // empty")"
            if [ -n "$run_id" ]; then
              break
            fi
            echo "No CI/CD run for ${HEAD_SHA} yet; waiting..."
            sleep 10
          done

          if [ -z "$run_id" ]; then
            echo "::error::No CI/CD run found for ${HEAD_SHA} after 5 minutes. Refusing to auto-merge an unverified commit."
            exit 1
          fi

          echo "Watching CI/CD run ${run_id} for ${HEAD_SHA}"
          gh run watch "$run_id" --repo "$GH_REPO" --exit-status

      - name: Approve the PR
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
